# Builds the tests on every push, and prebuilt downloads when a version tag is pushed:
#   git tag v0.7.3 && git push origin v0.7.3
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: ./tests/run.sh
      - run: ./tests/repl.sh
      - run: SKIP_BUILD=1 ./tests/lsp.sh
      - run: sudo apt-get install -y rpm cpio
      - run: ./tests/build.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lucode $GITHUB_REF_NAME" --generate-notes

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish a single self-contained file (no .NET install needed)
        run: >
          dotnet publish src/Lucode -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -p:InvariantGlobalization=true -o out --nologo
      - name: Pack
        run: |
          name=lucode-${GITHUB_REF_NAME}-${{ matrix.rid }}
          mkdir "$name"
          cp out/lucode* "$name"/ 
          rm -f "$name"/*.pdb
          cp README.md LICENSE "$name"/
          if [[ "${{ matrix.rid }}" == win-* ]]; then zip -r "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" $(ls lucode-*.zip lucode-*.tar.gz 2>/dev/null) --clobber
