# Builds the tests on every push, and prebuilt downloads when a version tag is pushed:
#   git tag v0.7.3 && git push origin v0.7.3
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: ./tests/run.sh
      - run: ./tests/repl.sh
      - run: SKIP_BUILD=1 ./tests/lsp.sh
      - run: sudo apt-get install -y rpm cpio
      - run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - run: ./tests/build.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: choco install innosetup --no-progress -y
      - name: Build, make an installer, install it silently and run the program
        shell: pwsh
        run: |
          dotnet publish src/Lucode -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:InvariantGlobalization=true -o out --nologo
          Set-Content hello.luc 'name = ask "Name?"', 'rule greeting = "Hello, " + name', 'print greeting'
          .\out\lucode.exe build hello.luc -o hello.exe
          if (("Sam" | .\hello.exe) -ne "Name? Hello, Sam") { throw "built program printed the wrong thing" }
          .\out\lucode.exe build hello.luc --installer -o hello-setup.exe --version 2.1
          Start-Process .\hello-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/DIR=C:\hello-test','/TASKS=' -Wait
          if (("Eve" | C:\hello-test\hello.exe) -ne "Name? Hello, Eve") { throw "installed program printed the wrong thing" }

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Build, make an app and a disk image, and run the program from each
        run: |
          dotnet publish src/Lucode -c Release -r osx-arm64 --self-contained -p:PublishSingleFile=true -p:InvariantGlobalization=true -o out --nologo
          printf 'name = ask "Name?"\nrule greeting = "Hello, " + name\nprint greeting\n' > hello.luc
          ./out/lucode build hello.luc -o hello
          test "$(echo Sam | ./hello 2>&1)" = "Name? Hello, Sam"
          ./out/lucode build hello.luc --app --version 2.1
          plutil -lint hello.app/Contents/Info.plist
          codesign --verify --deep hello.app
          test "$(echo Eve | ./hello.app/Contents/Resources/hello 2>&1)" = "Name? Hello, Eve"
          ./out/lucode build hello.luc --dmg -o hello.dmg --version 2.1
          for i in 1 2 3 4; do hdiutil attach hello.dmg -mountpoint /tmp/hello-dmg -nobrowse && break; sleep 3; done
          test "$(echo Ann | /tmp/hello-dmg/hello.app/Contents/Resources/hello 2>&1)" = "Name? Hello, Ann"
          for i in 1 2 3 4; do hdiutil detach /tmp/hello-dmg && break; sleep 3; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Lucode $GITHUB_REF_NAME" --generate-notes

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish a single self-contained file (no .NET install needed)
        run: >
          dotnet publish src/Lucode -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true
          -p:InvariantGlobalization=true -o out --nologo
      - name: Pack
        run: |
          name=lucode-${GITHUB_REF_NAME}-${{ matrix.rid }}
          mkdir "$name"
          cp out/lucode* "$name"/ 
          rm -f "$name"/*.pdb
          cp README.md LICENSE "$name"/
          if [[ "${{ matrix.rid }}" == win-* ]]; then zip -r "$name.zip" "$name"; else tar czf "$name.tar.gz" "$name"; fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" $(ls lucode-*.zip lucode-*.tar.gz 2>/dev/null) --clobber

  # lucode itself as .deb/.rpm/AppImage (Linux), setup program (Windows) and disk image (macOS).
  # Each package is built on a machine of its own kind, because the packager runs the matching lucode.
  native:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false # a flaky platform must not stop the other packages
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, tool: x86_64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, tool: aarch64 }
          - { os: windows-latest, rid: win-x64, tool: "" }
          - { os: macos-latest, rid: osx-arm64, tool: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish lucode
        shell: bash
        run: dotnet publish src/Lucode -c Release -r ${{ matrix.rid }} --self-contained -p:PublishSingleFile=true -p:InvariantGlobalization=true -o out --nologo
      - name: Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y rpm
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.tool }}.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          mkdir pkg && cd pkg
          for kind in deb rpm appimage; do ../out/lucode package --$kind --version "${GITHUB_REF_NAME#v}"; done
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          mkdir pkg && cd pkg
          ../out/lucode.exe package --installer --version "${GITHUB_REF_NAME#v}"
      - name: macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir pkg && cd pkg
          ../out/lucode package --dmg --version "${GITHUB_REF_NAME#v}" -o "lucode-${GITHUB_REF_NAME#v}-${{ matrix.rid }}.dmg"
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" pkg/* --clobber
